<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Themed Search Engine</title>
    <!-- Google Programmable Search Engine Script -->
    <script async src="https://cse.google.com/cse.js?cx=a0e4d147215c54bff"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f4e9; /* Light beige for an Islamic theme */
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #047857; /* Dark green */
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            font-family: 'Georgia', serif;
        }

        header p {
            margin: 5px 0 0;
            font-style: italic;
        }

        main {
            padding: 20px;
            text-align: center;
        }

        .gcse-searchbox-only {
            margin: 20px auto;
            max-width: 600px;
            background: #fff;
            border: 2px solid #047857; /* Green border */
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 10px;
        }

        footer {
            background-color: #047857; /* Dark green */
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }

        footer a {
            color: #fcd34d; /* Gold */
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Islamic Themed Search Engine</h1>
        <p>Search for knowledge with an Islamic touch</p>
    </header>
    <main>
        <!-- Google Programmable Search Engine Search Box -->
